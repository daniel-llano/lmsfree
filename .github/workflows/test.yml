name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/test.sh
      - name: Check EF migrations
        run: |
          dotnet tool install -g dotnet-ef
          dotnet ef migrations has-pending-model-changes --project src/LMSFree.Infrastructure --startup-project src/LMSFree.Api
        env:
          Jwt__Secret: ci-only-signing-key-that-is-long-enough
          ConnectionStrings__Lms: Host=localhost;Database=ci;Username=ci;Password=ci

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g playwright@1.62.1
      - run: playwright install --with-deps chromium
      - run: SKIP_INSTALL=1 ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
